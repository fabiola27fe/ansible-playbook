# main.yml
- name: Detectar sistema operativo y aplicar hardening
  hosts: all
  become: true
  gather_facts: no

  pre_tasks:
    - name: Detectar distribución
      raw: cat /etc/os-release
      register: os_release_output

    - name: Definir tipo de sistema operativo
      set_fact:
        os_family: >-
          {% if 'ID=amzn' in os_release_output.stdout %}
            amazon
          {% elif 'ID=ubuntu' in os_release_output.stdout %}
            ubuntu
          {% else %}
            unknown
          {% endif %}

    - name: Instalar Python en Amazon Linux
      raw: dnf install -y python3
      when: os_family == 'amazon'

    - name: Instalar Python en Ubuntu
      raw: |
        apt-get update -y
        apt-get install -y python3
      when: os_family == 'ubuntu'

    - name: Definir intérprete de Python
      set_fact:
        ansible_python_interpreter: /usr/bin/python3

    - name: Recolectar facts
      setup:

  tasks:
    - name: Mostrar sistema operativo
      debug:
        var: ansible_distribution

    - name: Incluir hardening para Ubuntu
      include_tasks: harden_ubuntu.yml
      when: ansible_distribution == "Ubuntu"

    - name: Incluir hardening para Amazon Linux
      include_tasks: harden_al23.yml
      when: ansible_distribution == "Amazon"

    - name: Incluir hardening para RHEL 
      include_tasks: harden_rhel88.yml
      when: ansible_distribution == "RedHat"

    - name: Incluir hardening para Windows
      include_tasks: harden_windows.yml
      when: ansible_os_family == "Windows"
